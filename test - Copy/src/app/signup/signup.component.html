<div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4 shadow">
          <h3 class="text-center mb-4">Signup</h3>
          <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
            
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="text" id="email" formControlName="email" class="form-control" placeholder="Enter your email" />
            </div>
  
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" id="name" formControlName="name" class="form-control" placeholder="Enter your name" />
            </div>
  
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" formControlName="password" class="form-control" placeholder="Enter your password" />
            </div>
  
            <div class="mb-3">
              <label for="role" class="form-label">Role</label>
              <select id="role" formControlName="role" class="form-control">
                <option value="">Select your role</option>
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
              </select>
            </div>
  
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Signup</button>
            </div>
  
          </form>
        </div>
      </div>
    </div>
  </div>
