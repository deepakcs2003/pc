<!-- app.component.html -->
<div class="app-wrapper">
  <aside class="sidebar" [class.open]="isSidebarOpen">
    <nav class="nav-menu">
      <div class="menu-header">Main Menu</div>
      <ul class="menu-items">
        <li><a routerLink="/students" routerLinkActive="active">Students</a></li>
        <li><a routerLink="/instructors" routerLinkActive="active">Instructors</a></li>
        <li><a routerLink="/courses" routerLinkActive="active">Courses</a></li>
        <li><a routerLink="/departments" routerLinkActive="active">Departments</a></li>
      </ul>
      
      <div class="menu-header">Account</div>
      <ul class="menu-items">
        <li><a routerLink="/login" routerLinkActive="active">Login</a></li>
        <li><a routerLink="/signup" routerLinkActive="active">Sign Up</a></li>
        <li><button class="logout-btn" (click)="logout()">Logout</button></li>
      </ul>
    </nav>
    
    <div class="sidebar-footer">
      <span>© 2025 UniPortal</span>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">{{ pageTitle }}</h1>
      <div class="page-actions">
        <button class="action-btn primary" *ngIf="showAddButton" (click)="onAddNew()">
          Add New
        </button>
      </div>
    </div>
    
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
    
    <footer class="footer">
      <p>University Management Information System | Version 2.0</p>
    </footer>
  </main>
</div>
