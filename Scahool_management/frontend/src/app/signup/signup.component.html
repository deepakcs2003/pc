<div class="signup-container">
    <h2>Sign Up</h2>
    <form class="signup-form" (submit)="onSignup()">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" [(ngModel)]="username" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" [(ngModel)]="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" [(ngModel)]="userpassword" required>
        </div>
        <div class="form-group">
            <label for="role">Role</label>
            <select id="role" name="role" [(ngModel)]="role" required>
                <option value="">Select Role</option>
                <option value="student">student</option>
                <option value="teacher">instructor</option>
                <option value="admin">admin</option>
            </select>
        </div>
        <button type="submit" class="signup-button">Sign Up</button>
    </form>
</div>
